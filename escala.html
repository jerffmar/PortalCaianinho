<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalas de Trabalhos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .available {
            background-color: #4CAF50;
            color: white;
        }
        .taken {
            background-color: orange;
            color: white;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Escalas de Trabalhos</h1>
    <table>
        <thead>
            <tr>
                <th>Tarefa</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="task-list">
            <!-- Tasks will be dynamically loaded -->
        </tbody>
    </table>
    <script src="tasks.js"></script>
</body>
</html>
